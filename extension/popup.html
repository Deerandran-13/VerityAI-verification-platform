<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VerityAI Verifier</title>
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e1a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.3px;
    }
    textarea {
      width: 100%;
      height: 75px;
      box-sizing: border-box;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      color: #e2e8f0;
      font-size: 12px;
      resize: none;
      outline: none;
    }
    textarea:focus {
      border-color: #38bdf8;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #0369a1;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .verified { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .outdated { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .contradicted { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .unsupported { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
    .result-box {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      display: none;
    }
    .scores-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #1e293b;
      font-size: 11px;
    }
    .score-val {
      font-weight: 700;
      color: #38bdf8;
    }
    .claims-list {
      max-height: 160px;
      overflow-y: auto;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .claim-item {
      background: #0f172a;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
    .full-link {
      display: block;
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .full-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">VerityAI Fast Verifier</span>
  </div>

  <textarea id="verify-input" placeholder="Paste AI answer or highlight text on any webpage..."></textarea>

  <div class="btn-row">
    <button id="verify-btn">Verify Facts with Live Research</button>
  </div>

  <div id="result-box" class="result-box">
    <div class="scores-row">
      <span>Freshness: <span id="freshness-val" class="score-val">—</span></span>
      <span>Confidence: <span id="confidence-val" class="score-val">—</span></span>
      <span>Claims: <span id="claims-count" class="score-val">0</span></span>
    </div>
    <div id="claims-list" class="claims-list"></div>
    <a id="full-report-link" class="full-link" href="#" target="_blank">View Complete Dossier in VerityAI &rarr;</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
